name: Build ImmortalWrt MT798x Kernel 6.6

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target Config (e.g., mt7981-ax3000, mt7986-ax6000)'
        required: true
        default: 'mt7981-ax3000'

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        # Replaced 'pkg-conf' with 'pkg-config' below
        sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
        bzip2 ccache clang clangd cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
        g++-multilib git gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev \
        libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev \
        libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkg-config \
        python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion \
        swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: Clone Source Code
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt

    - name: Update & Install Feeds
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load Custom Configuration
      working-directory: ./openwrt
      run: |
        # Copy the specific device config from the defconfig directory
        # Common targets: mt7981-ax3000.config, mt7986-ax6000.config
        cp -f defconfig/${{ github.event.inputs.target }}.config .config
        
        # Expand to full configuration
        make defconfig

    - name: Download Libraries
      working-directory: ./openwrt
      run: |
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Firmware
      working-directory: ./openwrt
      run: |
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 V=s

    - name: Assemble Artifacts
      run: |
        rm -rf ./artifact/
        mkdir -p ./artifact/
        find ./openwrt/bin/targets/ -name "*sysupgrade.bin" | xargs -i mv -f {} ./artifact/
        find ./openwrt/bin/targets/ -name "*factory.bin" | xargs -i mv -f {} ./artifact/
        find ./openwrt/bin/targets/ -name "*.manifest" | xargs -i mv -f {} ./artifact/
        find ./openwrt/bin/targets/ -name "config.buildinfo" | xargs -i mv -f {} ./artifact/

    - name: Upload Firmware
      uses: actions/upload-artifact@v4
      with:
        name: ImmortalWrt_6.6_Firmware
        path: ./artifact/
